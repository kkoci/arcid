[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arcid-cli"
version = "0.1.0"
description = "CLI for the ArcID hardware-backed agent identity registry on Arc."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13",
]

[project.scripts]
arcid = "arcid_cli:app"

[tool.setuptools]
py-modules = ["arcid_cli"]
